<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global ESP32 Control</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin-top: 50px; 
      background-color: #1a1a1a; 
      color: #fff; 
    }
    .btn { 
      padding: 15px 30px; 
      font-size: 20px; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      margin: 10px; 
      cursor: pointer; 
      width: 160px; 
    }
    .btn-on { background-color: #2ecc71; }
    .btn-off { background-color: #e74c3c; }
    #status { 
      margin-top: 25px; 
      font-weight: bold; 
      font-size: 14px; 
      color: #888; 
    }
  </style>
</head>
<body>
  <h1>ESP32 Global Controller</h1>
  <p>Control your LED from anywhere on Earth</p>
  
  <button class="btn btn-on" onclick="sendCmd('ON')">TURN ON</button>
  <button class="btn btn-off" onclick="sendCmd('OFF')">TURN OFF</button>
  
  <div id="status">Connecting to MQTT Broker...</div>

  <script>
    // ⚠️ MUST MATCH THE EXACT TOPIC NAME IN YOUR ESP32 CODE
    const topic = "myhome/esp32/led_control_98765";

    // Connected via Port 8884 for HTTPS/SSL WebSockets
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + Math.random().toString(16).substr(2, 8));

    client.onConnectionLost = function (responseObject) {
      document.getElementById("status").innerText = "Status: Disconnected";
      document.getElementById("status").style.color = "#e74c3c";
    };

    client.connect({
      useSSL: true, // Enabled for HTTPS compatibility on GitHub Pages
      onSuccess: function () {
        document.getElementById("status").innerText = "Status: Connected to Cloud Broker";
        document.getElementById("status").style.color = "#2ecc71";
      },
      onFailure: function (err) {
        document.getElementById("status").innerText = "Status: Connection Failed (" + err.errorMessage + ")";
        document.getElementById("status").style.color = "#e74c3c";
      }
    });

    function sendCmd(command) {
      if (client.isConnected()) {
        const message = new Paho.MQTT.Message(command);
        message.destinationName = topic;
        client.send(message);
      } else {
        alert("Not connected to MQTT broker!");
      }
    }
  </script>
</body>
</html>
