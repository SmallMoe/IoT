<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 MediaPipe Cloud Gesture Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js library for browser WebSockets -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- MediaPipe Hands Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mirror { transform: scaleX(-1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl max-w-md w-full text-center space-y-4">
        <h1 class="text-lg font-bold">ESP32 Cloud Gesture Control</h1>
        <p id="connectionStatus" class="text-xs text-amber-400 font-mono">Connecting to cloud broker...</p>

        <!-- Webcam Feed & AI Canvas Overlay -->
        <div class="relative bg-slate-950 rounded-xl overflow-hidden aspect-video border border-slate-800 flex items-center justify-center">
            <video id="webcamVideo" class="hidden" playsinline></video>
            <canvas id="outputCanvas" class="w-full h-full mirror object-cover"></canvas>
            <div id="gestureHud" class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-lg text-xs font-mono text-blue-400">
                Gesture: Waiting...
            </div>
        </div>

        <button onclick="toggleWebcam()" id="camBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow transition cursor-pointer">
            Start Camera & Gesture AI
        </button>

        <div class="text-[11px] text-slate-400 space-y-1 text-left bg-slate-950 p-3 rounded-xl border border-slate-800">
            <div>☝️ <b>1 Finger:</b> Red</div>
            <div>✌️ <b>2 Fingers:</b> Green</div>
            <div>🤟 <b>3 Fingers:</b> Blue</div>
            <div>✊ <b>Fist / 0 Fingers:</b> Off</div>
        </div>
    </div>

    <script>
        // Connect to HiveMQ Public Broker via Secure WebSockets[cite: 2]
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const topic = 'esp32/rgb/control';

        const client = mqtt.connect(brokerUrl);
        const statusEl = document.getElementById('connectionStatus');
        const gestureHud = document.getElementById('gestureHud');

        let isCloudConnected = false;
        let hands = null;
        let camera = null;
        let isCameraActive = false;
        let lastSentGesture = "";

        client.on('connect', () => {
            isCloudConnected = true;
            statusEl.textContent = "Cloud Connected! Ready.";
            statusEl.className = "text-xs text-emerald-400 font-mono";
        });

        client.on('error', (err) => {
            statusEl.textContent = "Cloud Connection Error!";
            statusEl.className = "text-xs text-rose-400 font-mono";
            console.error(err);
        });

        function sendMqttCommand(color) {
            if (!isCloudConnected) return;
            if (color !== lastSentGesture) {
                client.publish(topic, color, { qos: 0 }, (err) => {
                    if (!err) {
                        lastSentGesture = color;
                        console.log(`Published Gesture: ${color}`);
                    }
                });
            }
        }

        function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });
            hands.onResults(onHandResults);
        }

        async function toggleWebcam() {
            if (isCameraActive) {
                stopWebcam();
            } else {
                await startWebcam();
            }
        }

        async function startWebcam() {
            if (!hands) initMediaPipe();
            const videoElement = document.getElementById('webcamVideo');

            try {
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });
                await camera.start();
                isCameraActive = true;
                document.getElementById('camBtn').textContent = "Stop Camera";
                document.getElementById('camBtn').className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl shadow transition cursor-pointer";
            } catch (err) {
                alert("Camera permission denied or unavailable.");
            }
        }

        function stopWebcam() {
            if (camera) {
                camera.stop();
                camera = null;
            }
            isCameraActive = false;
            document.getElementById('camBtn').textContent = "Start Camera & Gesture AI";
            document.getElementById('camBtn').className = "w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow transition cursor-pointer";
            gestureHud.textContent = "Gesture: Stopped";
        }

        function onHandResults(results) {
            const canvas = document.getElementById('outputCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = results.image.width;
            canvas.height = results.image.height;

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#3b82f6', lineWidth: 2 });
                drawLandmarks(ctx, lm, { color: '#ef4444', lineWidth: 1, radius: 3 });

                let count = 0;
                if (lm[8].y < lm[6].y) count++;   // Index up
                if (lm[12].y < lm[10].y) count++; // Middle up
                if (lm[16].y < lm[14].y) count++; // Ring up

                if (count === 1) {
                    gestureHud.textContent = "Gesture: 1 Finger (RED)";
                    sendMqttCommand('RED');
                } else if (count === 2) {
                    gestureHud.textContent = "Gesture: 2 Fingers (GREEN)";
                    sendMqttCommand('GREEN');
                } else if (count === 3) {
                    gestureHud.textContent = "Gesture: 3 Fingers (BLUE)";
                    sendMqttCommand('BLUE');
                } else {
                    gestureHud.textContent = "Gesture: 0 Fingers (OFF)";
                    sendMqttCommand('OFF');
                }
            } else {
                gestureHud.textContent = "Gesture: No Hand Detected";
                sendMqttCommand('OFF');
            }
            ctx.restore();
        }
    </script>
</body>
</html>
